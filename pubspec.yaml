name: kgka_music_hl
description: "the best music application"
publish_to: 'none'
version: 3.1.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # Local Android compatibility patch: connect to our AudioService subclass so
  # vivo's vendor bind action and the app share the exact same media session.
  audio_service:
    path: packages/audio_service
  audio_session: ^0.2.4
  http: ^1.5.0
  just_audio: ^0.10.4
  just_audio_windows: ^0.2.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  dio: ^5.7.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^12.0.0
  flutter_lyric: ^3.0.7
  permission_handler: ^13.0.1
  lpinyin: ^2.0.3
  liquid_glass_easy: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - update.md
    - lib/assets/logo.png
